name: PULSE PR checks
on:
  pull_request:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check pulse-data.js && node --check pulse-app.js
      - run: node --test tests/*.test.cjs
