name: Deploy PULSE

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate platform
        run: |
          test -f index.html
          test -f clientes.html
          test -f cliente.html
          test -f operacoes.html
          test -f mensagens.html
          test -f relatorios.html
          test -f automacoes.html
          test -f equipe.html
          test -f configuracoes.html
          test -f pulse-data.js
          test -f pulse-app.js
          test -f pulse-app.css
          node --check pulse-data.js
          node --check pulse-app.js

      - name: Browser smoke test
        run: |
          python3 -m http.server 4173 >/tmp/site.log 2>&1 &
          SERVER_PID=$!
          trap "kill $SERVER_PID || true" EXIT
          sleep 1
          BROWSER="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$BROWSER"
          timeout 25s "$BROWSER" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=4000 --dump-dom http://127.0.0.1:4173/ > /tmp/dom.html || true
          echo "===== RENDERED DOM ====="
          head -c 12000 /tmp/dom.html || true
          echo
          echo "===== END DOM ====="
          grep -Fq "Receita processada" /tmp/dom.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
